<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Voxl Manager app icon</title>
  <desc>A luminous V on a desktop display, set into a cobalt tile with a green connection light.</desc>
  <defs>
    <path id="plate" d="M325 78h374c175 0 247 72 247 247v366c0 175-72 247-247 247H325c-175 0-247-72-247-247V325C78 150 150 78 325 78Z"/>
    <clipPath id="tile"><use xlink:href="#plate"/></clipPath>
    <clipPath id="screen"><rect x="218" y="258" width="588" height="333" rx="48"/></clipPath>
    <linearGradient id="body" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#5676F1"/>
      <stop offset="42%" stop-color="#314DCA"/>
      <stop offset="100%" stop-color="#18266C"/>
    </linearGradient>
    <radialGradient id="glow" cx="88%" cy="6%" r="71%">
      <stop offset="0%" stop-color="#46B5F5" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#46B5F5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="15%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#D3E8FF" stop-opacity=".62"/>
      <stop offset="48%" stop-color="#80B3FF" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#324C9C" stop-opacity=".46"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0%" y1="0%" x2="65%" y2="100%">
      <stop offset="0%" stop-color="#293D76"/>
      <stop offset="100%" stop-color="#0A132F"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#1C2D5F"/>
      <stop offset="61%" stop-color="#111E42"/>
      <stop offset="100%" stop-color="#0E1732"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8BA7ED"/>
      <stop offset="70%" stop-color="#ACC5FB"/>
      <stop offset="100%" stop-color="#6787D7"/>
    </linearGradient>
    <linearGradient id="mark" x1="17%" y1="0%" x2="72%" y2="100%">
      <stop offset="0%" stop-color="#F3FDFF"/>
      <stop offset="45%" stop-color="#BDF3FF"/>
      <stop offset="100%" stop-color="#59D7F8"/>
    </linearGradient>
