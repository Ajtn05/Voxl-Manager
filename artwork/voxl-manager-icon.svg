  <use xlink:href="#plate" transform="translate(0 16)" fill="#10162F" opacity=".26"/>
  <use xlink:href="#plate" transform="translate(0 7)" fill="#10162F" opacity=".47"/>
  <use xlink:href="#plate" fill="url(#body)"/>
  <g clip-path="url(#tile)">
    <rect x="78" y="78" width="868" height="860" fill="url(#glow)"/>
    <path d="M654 938H338l608-608v316Z" fill="#638DFA" opacity=".08"/>
    <path d="M610 938h-3l339-339v3ZM673 938h-3l276-276v3Z" fill="#A8CBFF" opacity=".22"/>
  </g>
  <use xlink:href="#plate" fill="none" stroke="url(#edge)" stroke-width="6"/>

  <path d="M458 607h108l10 86q5 34 49 43H399q44-9 49-43Z" fill="#0C1537" opacity=".45" transform="translate(0 10)"/>
  <path d="M458 607h108l10 86q5 34 49 43H399q44-9 49-43Z" fill="url(#metal)"/>
  <rect x="367" y="724" width="290" height="37" rx="18.5" fill="#0C1537" opacity=".36" transform="translate(0 7)"/>
  <rect x="367" y="724" width="290" height="37" rx="18.5" fill="url(#metal)"/>
  <path d="M386 729h252" stroke="#E9F5FF" stroke-opacity=".49" stroke-width="3" stroke-linecap="round"/>

  <rect x="190" y="232" width="644" height="385" rx="73" fill="#08102A" opacity=".44" transform="translate(0 14)"/>
  <rect x="190" y="232" width="644" height="385" rx="73" fill="url(#bezel)" stroke="#A9C9FF" stroke-opacity=".72" stroke-width="5"/>
  <rect x="218" y="258" width="588" height="333" rx="48" fill="url(#glass)"/>
  <g clip-path="url(#screen)">
    <path d="M218 258h588v40L322 591H218Z" fill="#96B9FF" opacity=".055"/>
    <path d="M218 259h588" fill="none" stroke="#B0CCFF" stroke-opacity=".24" stroke-width="5"/>
  </g>

  <path d="M343 333q-12 0-7 11l124 180q6 9 17 9h64q11 0 17-9l124-180q5-11-7-11h-59q-11 0-17 10l-90 134-90-134q-6-10-17-10Z" fill="#060E26" opacity=".58" transform="translate(0 7)"/>
  <path d="M343 333q-12 0-7 11l124 180q6 9 17 9h64q11 0 17-9l124-180q5-11-7-11h-59q-11 0-17 10l-90 134-90-134q-6-10-17-10Z" fill="url(#mark)"/>
  <circle cx="754" cy="542" r="20" fill="#63F9CE" opacity=".16"/>
  <circle cx="754" cy="542" r="10" fill="#7DFFDA"/>
</svg>
